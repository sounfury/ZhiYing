# yamllint disable-line rule:line-length
# yaml-language-server: $schema=https://raw.githubusercontent.com/woodpecker-ci/woodpecker/v3.19.0/pipeline/frontend/yaml/linter/schema/schema.json
# Independent GitHub check: copy-paste (jscpd).
# Manual skip: SKIP_DUPLICATION=true
# Manual non-blocking: DUPLICATION_NONBLOCK=true
# Secret scan is not controlled by these variables.

name: duplication

when:
  - event: [push, pull_request, manual]

steps:
  - name: jscpd
    image: node:22-bookworm-slim
    when:
      - evaluate: 'SKIP_DUPLICATION != "true" && DUPLICATION_NONBLOCK != "true"'
    commands:
      - npm install --global jscpd@5.4.1
      - jscpd . --config quality/jscpd.json --no-colors --no-tips
  - name: jscpd-nonblock
    image: node:22-bookworm-slim
    failure: ignore
    when:
      - evaluate: 'SKIP_DUPLICATION != "true" && DUPLICATION_NONBLOCK == "true"'
    commands:
      - npm install --global jscpd@5.4.1
      - jscpd . --config quality/jscpd.json --no-colors --no-tips
