# yamllint disable-line rule:line-length
# yaml-language-server: $schema=https://raw.githubusercontent.com/woodpecker-ci/woodpecker/v3.19.0/pipeline/frontend/yaml/linter/schema/schema.json
# GitHub 独立检查：文件/类行数（detekt LargeClass）
# 手动跳过：SKIP_FILE_LENGTH=true
# 失败不阻断：FILE_LENGTH_NONBLOCK=true
# 密钥扫描不受这两个变量控制。

when:
  - event: [push, pull_request, manual]
    path:
      include:
        - "zhiying_backend/**/*.kt"
        - "quality/**"
        - ".woodpecker/文件行数.yaml"
      on_empty: false

steps:
  - name: 文件行数
    image: local/detekt-cli:2.0.0-alpha.6
    pull: false
    when:
      - evaluate: 'SKIP_FILE_LENGTH != "true" && FILE_LENGTH_NONBLOCK != "true"'
    commands:
      - >-
        java -jar /opt/detekt-cli.jar
        --input zhiying_backend
        --config quality/detekt-file-length.yml
        --fail-on-severity Info
        --excludes '**/build/**,**/.gradle/**'
        --base-path .
  - name: 文件行数（不阻断）
    image: local/detekt-cli:2.0.0-alpha.6
    pull: false
    failure: ignore
    when:
      - evaluate: 'SKIP_FILE_LENGTH != "true" && FILE_LENGTH_NONBLOCK == "true"'
    commands:
      - >-
        java -jar /opt/detekt-cli.jar
        --input zhiying_backend
        --config quality/detekt-file-length.yml
        --fail-on-severity Info
        --excludes '**/build/**,**/.gradle/**'
        --base-path .
