# yamllint disable-line rule:line-length
# yaml-language-server: $schema=https://raw.githubusercontent.com/woodpecker-ci/woodpecker/v3.19.0/pipeline/frontend/yaml/linter/schema/schema.json
# GitHub 独立检查：密钥扫描（gitleaks）
# 本项不可跳过、不可设为不阻断。

when:
  - event: [push, pull_request, manual]

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      partial: false

steps:
  - name: 密钥扫描
    image: ghcr.io/gitleaks/gitleaks:v8.30.1
    commands:
      - >-
        gitleaks git .
        --config quality/gitleaks.toml
        --redact=100 --no-banner --exit-code 1
      - >-
        gitleaks dir .
        --config quality/gitleaks.toml
        --redact=100 --no-banner --exit-code 1
